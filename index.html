const cv=document.getElementById('c'),panel=document.getElementById('panel');

void main(){

const seaFrag=`precision highp float;uniform float u_time;${CG}
varying vec3 vWP;varying vec3 vWN;varying float vH;varying vec4 vMirror;

float gridLine(vec2 p,float sp){vec2 g=abs(fract(p/sp-0.5)-0.5)/fwidth(p/sp);return 1.0-clamp(min(g.x,g.y),0.0,1.0);}

 vec2 P=vWP.xz;

function setSound(on){sndOn=on;const b=document.getElementById('btnSound');b.textContent=on?'sound on':'sound off';b.classList.toggle('p',on);if(on){initAudio();if(audio){if(audio.ctx.resume)audio.ctx.resume();audio.master.gain.setTargetAtTime(0.12,audio.ctx.currentTime,0.6);}}else if(audio){audio.master.gain.setTargetAtTime(0.0,audio.ctx.currentTime,0.3);}}
function blip(freq,dur,vol){if(!audio||!sndOn)return;try{const ctx=audio.ctx,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;o.connect(g);g.connect(audio.master);const n=ctx.currentTime;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(vol||0.25,n+0.012);g.gain.exponentialRampToValueAtTime(0.0008,n+(dur||0.25));o.start(n);o.stop(n+(dur||0.25)+0.03);}catch(e){}}
document.getElementById('btnSound').onclick=()=>setSound(!sndOn);
// idle camera drift + cinematic intro
controls.autoRotate=false;controls.autoRotateSpeed=0.32;let lastInteract=0;
controls.addEventListener('start',()=>{lastInteract=t;});
const introEl=document.getElementById('intro');let introDone=false,introT=0;
const camStart=new THREE.Vector3(0,440,46),camEnd=new THREE.Vector3(0,152,178),tgtStart=new THREE.Vector3(0,0,-8),tgtEnd=new THREE.Vector3(0,0,-25);
if(reduce){introDone=true;introEl.style.display='none';}else{controls.enabled=false;cam.position.copy(camStart);controls.target.copy(tgtStart);requestAnimationFrame(()=>introEl.classList.add('go'));}

document.getElementById('boot').style.display='none';
let t=0;(function loop(){try{t+=0.016;seaPlane.material.uniforms.u_time.value=t;sc.children[0].material.uniforms.u_time.value=t;islMat.uniforms.u_time.value=t;
 boats.forEach(b=>updBoat(b,t));
 laneMat.opacity=0.22+0.12*Math.sin(t*1.2);
 // sonar ping expand+fade
 if(sonar.visible){sonarT+=0.016;const pr=sonarT/1.2;if(pr>=1.0){sonar.visible=false;}else{const ss=2.0+pr*26.0;sonar.scale.set(ss,ss,ss);sonar.material.opacity=0.7*(1.0-pr);if(selected)sonar.position.set(selected.position.x,selected.position.y+0.4,selected.position.z);}}
 // ticker fade-out
 if(t-tickerAt>4.5)tickerEl.style.opacity='0';
 // instrument HUD (throttled ~2/sec)
 if(((t*60)|0)%30===0){stValue.textContent='$'+((boundedBase+voyages*1300+Math.sin(t*0.2)*4000)/1e6).toFixed(2)+'M';stVoy.textContent=voyages.toLocaleString();}
 // camera: cinematic intro crane, then orbit controls + idle drift + selection dolly
 if(!introDone){introT+=0.016;const pr=Math.min(1.0,introT/3.4);const e=pr<0.5?2.0*pr*pr:1.0-Math.pow(-2.0*pr+2.0,2.0)/2.0;cam.position.lerpVectors(camStart,camEnd,e);controls.target.lerpVectors(tgtStart,tgtEnd,e);cam.lookAt(controls.target);if(pr>=1.0){introDone=true;controls.enabled=true;introEl.classList.add('done');setTimeout(()=>{introEl.style.display='none';},1200);}}
 else{if(follow&&selected){controls.target.lerp(selected.position,0.06);}controls.autoRotate=(!follow&&!selected&&(t-lastInteract>5.0)&&!reduce);controls.update();if(follow&&selected){const off=cam.position.clone().sub(controls.target);if(off.length()>96.0){off.multiplyScalar(0.985);cam.position.copy(controls.target).add(off);}}}
 islLabels.forEach(L=>{const p=project(L.pos);L.el.style.left=p.x+'px';L.el.style.top=p.y+'px';L.el.style.opacity=p.vis?'1':'0';});
 netLabels.forEach(L=>{const p=project(L.pos);L.el.style.left=p.x+'px';L.el.style.top=p.y+'px';L.el.style.opacity=p.vis?'0.9':'0';});
 composer?composer.render():rdr.render(sc,cam);}catch(err){fail('loop · '+(err&&err.message?err.message:err));return;}requestAnimationFrame(loop);})();
addEventListener('resize',()=>{cam.aspect=W()/H();cam.updateProjectionMatrix();rdr.setSize(W(),H());if(composer)composer.setSize(W(),H());});
}catch(err){fail('setup · '+(err&&err.message?err.message:err));}
